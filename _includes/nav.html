<header class="site-header{% unless page.transparent_header %} solid{% endunless %}">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">Project Possibility</a>

    <button type="button" class="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">
      <span></span><span></span><span></span>
    </button>

    <nav class="site-nav" id="site-nav">
      <span class="nav-group-title nav-group-title--mobile">Explore</span>

      <a href="{{ '/' | relative_url }}" class="nav-mobile-only">Home</a>

      <div class="nav-group">
        <span class="nav-group-title">Our work</span>
        <div class="nav-group-menu">
          <a href="{{ '/projects/' | relative_url }}">What we're planning</a>
          <a href="{{ '/community-library/' | relative_url }}">Community Library</a>
          <a href="{{ '/movie-time/' | relative_url }}">Movie Premiere</a>
          <a href="{{ '/past-events/' | relative_url }}">What we've done</a>
        </div>
      </div>

      <a href="{{ '/past-events/' | relative_url }}" class="nav-mobile-only">What we've done</a>
      <a href="{{ '/projects/' | relative_url }}" class="nav-mobile-only">What we're planning</a>

      <div class="nav-group">
        <span class="nav-group-title">About</span>
        <div class="nav-group-menu">
          <a href="{{ '/about/' | relative_url }}">About us</a>
          <a href="{{ '/partners/' | relative_url }}">Partners</a>
          <a href="{{ '/get-involved/' | relative_url }}">Get involved</a>
        </div>
      </div>

      <a href="{{ '/about/' | relative_url }}" class="nav-mobile-only">About us</a>
      <a href="{{ '/get-involved/' | relative_url }}" class="nav-mobile-only">Get involved</a>

      <a class="btn btn-solid" href="{{ site.justgiving_url }}" rel="noopener">Donate</a>

      <p class="nav-foot nav-mobile-only">
        <a href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a><br>
        <span>Registered charity no. {{ site.charity_number }}</span>
      </p>
    </nav>
  </div>
</header>
